name: patch-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Acquire exact official originals and reproduce all DAT hashes
        run: python patcher.py prepare --skip-updater
      - name: Actual-Thumb audits and malformed-input rejection
        run: python -m pytest -q
